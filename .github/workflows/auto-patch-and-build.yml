name: Auto Patch and Build TrueBit

on:
  schedule:
    # Run every 6 hours to check for upstream BitChord releases
    - cron: '0 */6 * * *'
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - '.github/workflows/**'
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Force build even if tag already exists'
        required: false
        type: boolean
        default: false
      custom_tag:
        description: 'Specific upstream tag to build (leave blank for latest)'
        required: false
        type: string
        default: ''

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      should_build: ${{ steps.check_release.outputs.should_build }}
      published: ${{ steps.publish_release.outputs.release_id != '' }}

    steps:
      - name: Checkout TrueBit Repo (for patches & workflow)
        uses: actions/checkout@v4
        with:
          path: truebit-repo

      - name: Check for New Upstream Release
        id: check_release
        run: |
          UPSTREAM_REPO="kushagrasinghx/BitChord"
          MY_REPO="${{ github.repository }}"
          
          # 1. Determine upstream tag
          if [ -n "${{ github.event.inputs.custom_tag }}" ]; then
            TAG="${{ github.event.inputs.custom_tag }}"
            echo "Using custom requested tag: $TAG"
          else
            LATEST_UPSTREAM=$(curl -s "https://api.github.com/repos/${UPSTREAM_REPO}/releases/latest" | jq -r .tag_name)
            if [ -z "$LATEST_UPSTREAM" ] || [ "$LATEST_UPSTREAM" = "null" ]; then
              # Fallback to tags if no official release yet
              LATEST_UPSTREAM=$(curl -s "https://api.github.com/repos/${UPSTREAM_REPO}/tags" | jq -r '.[0].name')
            fi
            TAG="$LATEST_UPSTREAM"
            echo "Latest upstream release tag: $TAG"
          fi

          if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
            echo "Error: Could not determine upstream tag."
            exit 1
          fi

          # 2. Check if this release already exists in TrueBit
          TRUEBIT_TAG="${TAG}"
          RELEASE_EXISTS=$(curl -s -o /dev/null -w "%{http_code}" "https://api.github.com/repos/${MY_REPO}/releases/tags/${TRUEBIT_TAG}")
          
          FORCE="${{ github.event.inputs.force_build }}"
          if [ "$RELEASE_EXISTS" = "200" ] && [ "$FORCE" != "true" ]; then
            echo "Release ${TRUEBIT_TAG} already exists on ${MY_REPO}. Skipping build."
            echo "should_build=false" >> $GITHUB_OUTPUT
          else
            echo "Proceeding with build for ${TAG} (target release: ${TRUEBIT_TAG})"
            echo "should_build=true" >> $GITHUB_OUTPUT
            echo "upstream_tag=${TAG}" >> $GITHUB_OUTPUT
            echo "truebit_tag=${TRUEBIT_TAG}" >> $GITHUB_OUTPUT
          fi

      - name: Clone Upstream BitChord at Tag
        if: steps.check_release.outputs.should_build == 'true'
        run: |
          TAG="${{ steps.check_release.outputs.upstream_tag }}"
          git clone --depth 1 --branch "$TAG" https://github.com/kushagrasinghx/BitChord.git build-dir
          echo "Cloned BitChord at tag $TAG"
          # Strip desktop targets so only Android and Go backend remain
          rm -rf build-dir/desktopApp
          echo "Stripped desktopApp targets"

      - name: Apply TrueBit Patches & Assets
        if: steps.check_release.outputs.should_build == 'true'
        run: |
          cd build-dir
          git config user.name "TrueBit Bot"
          git config user.email "bot@truebit.local"

          echo "Applying TrueBit branding assets..."
          cp -r ../truebit-repo/assets/res/* ./app/src/main/res/
          cp ../truebit-repo/assets/logo.png ./Logo.png
          cp ../truebit-repo/assets/banner.png ./Banner.png
          cp ../truebit-repo/README.md ./README.md
          if [ -d "../truebit-repo/docs" ]; then
            cp -r ../truebit-repo/docs ./docs
          fi

          echo "Applying TrueBit patch suite..."
          for patch in ../truebit-repo/.patches/*.patch; do
            if [ -f "$patch" ]; then
              patch_name=$(basename "$patch")
              echo "==> Applying: $patch_name"
              git apply --verbose "$patch" || {
                echo "❌ Failed to apply $patch_name cleanly."
                echo "Attempting 3-way merge apply..."
                git apply -3 --verbose "$patch" || exit 1
              }
            fi
          done
          echo "✅ All patches and assets applied successfully!"

          # Stage and commit patched source code
          git add -A
          git commit -m "chore: apply TrueBit patches to ${{ steps.check_release.outputs.upstream_tag }}"
          echo "✅ Patched source committed locally in build-dir!"

      - name: Setup JDK 17
        if: steps.check_release.outputs.should_build == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        if: steps.check_release.outputs.should_build == 'true'
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Build Android Release APK
        if: steps.check_release.outputs.should_build == 'true'
        run: |
          cd build-dir
          chmod +x gradlew
          # Build production release APK (skip unit tests)
          ./gradlew assembleProdRelease -x test --no-daemon --stacktrace

      - name: Sign APKs (Keystore or Auto-Debug Key)
        if: steps.check_release.outputs.should_build == 'true'
        id: sign_apk
        run: |
          mkdir -p signed-apks
          TAG="${{ steps.check_release.outputs.upstream_tag }}"
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          echo "Using Android Build Tools: $BUILD_TOOLS"

          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Using custom signing keystore from secrets..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > keystore.jks
            KS_FILE="keystore.jks"
            KS_ALIAS="${{ secrets.KEY_ALIAS }}"
            KS_PASS="pass:${{ secrets.KEYSTORE_PASSWORD }}"
            KEY_PASS="pass:${{ secrets.KEY_PASSWORD }}"
          else
            echo "No custom keystore secret found. Generating consistent signing key for this build..."
            keytool -genkeypair -v -keystore auto.keystore -alias truebit -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "truebitpass" -keypass "truebitpass" -dname "CN=TrueBit, OU=Audio, O=TrueBit, L=HQ, S=Audio, C=US"
            KS_FILE="auto.keystore"
            KS_ALIAS="truebit"
            KS_PASS="pass:truebitpass"
            KEY_PASS="pass:truebitpass"
          fi

          found_count=0
          while IFS= read -r raw_apk; do
            if [ -n "$raw_apk" ]; then
              filename=$(basename "$raw_apk")
              echo "Processing APK: $filename ($raw_apk)"
              
              if [[ "$filename" == *"arm64-v8a"* ]]; then
                out_name="TrueBit-${TAG}-arm64.apk"
              elif [[ "$filename" == *"universal"* ]]; then
                out_name="TrueBit-${TAG}.apk"
              elif [[ "$filename" == *"armeabi-v7a"* ]]; then
                out_name="TrueBit-${TAG}-armeabi-v7a.apk"
              elif [[ "$filename" == *"x86_64"* ]]; then
                out_name="TrueBit-${TAG}-x86_64.apk"
              else
                out_name="TrueBit-${TAG}-${filename}"
              fi
              
              target="signed-apks/${out_name}"
              echo "Signing $raw_apk -> $target"
              $BUILD_TOOLS/apksigner sign \
                --ks "$KS_FILE" \
                --ks-key-alias "$KS_ALIAS" \
                --ks-pass "$KS_PASS" \
                --key-pass "$KEY_PASS" \
                --out "$target" \
                "$raw_apk"
              found_count=$((found_count + 1))
            fi
          done < <(find build-dir/app/build/outputs/apk -name "*.apk" | grep -v "unaligned")

          if [ "$found_count" -eq 0 ]; then
            echo "Error: No release APKs found to sign!"
            exit 1
          fi

          echo "✅ Successfully signed $found_count APKs:"
          ls -lh signed-apks/

      - name: Generate TrueBit Rebadged Release Notes
        if: steps.check_release.outputs.should_build == 'true'
        run: |
          python3 "${{ github.workspace }}/truebit-repo/scripts/rebadge_release.py" "${{ steps.check_release.outputs.upstream_tag }}" "${{ github.repository }}"

      - name: Publish GitHub Release
        if: steps.check_release.outputs.should_build == 'true'
        id: publish_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.check_release.outputs.truebit_tag }}
          target_commitish: ${{ github.sha }}
          token: ${{ secrets.GITHUB_TOKEN }}
          name: "TrueBit ${{ steps.check_release.outputs.upstream_tag }} (BitChord Auto-Patched)"
          body_path: release_notes.md
          files: signed-apks/*.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-pages:
    name: Deploy GitHub Pages
    runs-on: ubuntu-latest
    needs: check-and-build
    if: always() && (needs.check-and-build.result == 'success' || github.event_name == 'push')
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout TrueBit Repo
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './docs'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
