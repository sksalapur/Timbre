name: Auto Patch and Build TrueBit

on:
  schedule:
    # Run every 6 hours to check for upstream BitChord releases
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Force build even if tag already exists'
        required: false
        type: boolean
        default: false
      custom_tag:
        description: 'Specific upstream tag to build (leave blank for latest)'
        required: false
        type: string
        default: ''

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout TrueBit Repo (for patches & workflow)
        uses: actions/checkout@v4
        with:
          path: truebit-repo

      - name: Check for New Upstream Release
        id: check_release
        run: |
          UPSTREAM_REPO="kushagrasinghx/BitChord"
          MY_REPO="${{ github.repository }}"
          
          # 1. Determine upstream tag
          if [ -n "${{ github.event.inputs.custom_tag }}" ]; then
            TAG="${{ github.event.inputs.custom_tag }}"
            echo "Using custom requested tag: $TAG"
          else
            LATEST_UPSTREAM=$(curl -s "https://api.github.com/repos/${UPSTREAM_REPO}/releases/latest" | jq -r .tag_name)
            if [ -z "$LATEST_UPSTREAM" ] || [ "$LATEST_UPSTREAM" = "null" ]; then
              # Fallback to tags if no official release yet
              LATEST_UPSTREAM=$(curl -s "https://api.github.com/repos/${UPSTREAM_REPO}/tags" | jq -r '.[0].name')
            fi
            TAG="$LATEST_UPSTREAM"
            echo "Latest upstream release tag: $TAG"
          fi

          if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
            echo "Error: Could not determine upstream tag."
            exit 1
          fi

          # 2. Check if this release already exists in TrueBit
          TRUEBIT_TAG="${TAG}"
          RELEASE_EXISTS=$(curl -s -o /dev/null -w "%{http_code}" "https://api.github.com/repos/${MY_REPO}/releases/tags/${TRUEBIT_TAG}")
          
          FORCE="${{ github.event.inputs.force_build }}"
          if [ "$RELEASE_EXISTS" = "200" ] && [ "$FORCE" != "true" ]; then
            echo "Release ${TRUEBIT_TAG} already exists on ${MY_REPO}. Skipping build."
            echo "should_build=false" >> $GITHUB_OUTPUT
          else
            echo "Proceeding with build for ${TAG} (target release: ${TRUEBIT_TAG})"
            echo "should_build=true" >> $GITHUB_OUTPUT
            echo "upstream_tag=${TAG}" >> $GITHUB_OUTPUT
            echo "truebit_tag=${TRUEBIT_TAG}" >> $GITHUB_OUTPUT
          fi

      - name: Clone Upstream BitChord at Tag
        if: steps.check_release.outputs.should_build == 'true'
        run: |
          TAG="${{ steps.check_release.outputs.upstream_tag }}"
          git clone --depth 1 --branch "$TAG" https://github.com/kushagrasinghx/BitChord.git build-dir
          echo "Cloned BitChord at tag $TAG"
          # Strip desktop targets so only Android and Go backend remain
          rm -rf build-dir/desktopApp
          echo "Stripped desktopApp targets"

      - name: Apply TrueBit Patches & Assets
        if: steps.check_release.outputs.should_build == 'true'
        run: |
          cd build-dir
          git config user.name "TrueBit Bot"
          git config user.email "bot@truebit.local"

          echo "Applying TrueBit branding assets..."
          cp -r ../truebit-repo/assets/res/* ./app/src/main/res/
          cp ../truebit-repo/assets/logo.png ./Logo.png
          cp ../truebit-repo/assets/banner.png ./Banner.png
          cp ../truebit-repo/README.md ./README.md

          echo "Applying TrueBit patch suite..."
          for patch in ../truebit-repo/.patches/*.patch; do
            if [ -f "$patch" ]; then
              patch_name=$(basename "$patch")
              echo "==> Applying: $patch_name"
              git apply --verbose "$patch" || {
                echo "❌ Failed to apply $patch_name cleanly."
                echo "Attempting 3-way merge apply..."
                git apply -3 --verbose "$patch" || exit 1
              }
            fi
          done
          echo "✅ All patches and assets applied successfully!"

          # Stage and commit patched source code
          git add -A
          git commit -m "chore: apply TrueBit patches to ${{ steps.check_release.outputs.upstream_tag }}"
          echo "✅ Patched source committed locally in build-dir!"

      - name: Setup JDK 17
        if: steps.check_release.outputs.should_build == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        if: steps.check_release.outputs.should_build == 'true'
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Build Android Release APK
        if: steps.check_release.outputs.should_build == 'true'
        run: |
          cd build-dir
          chmod +x gradlew
          # Build production release APK (skip unit tests)
          ./gradlew assembleProdRelease -x test --no-daemon --stacktrace

      - name: Sign APK (Keystore or Auto-Debug Key)
        if: steps.check_release.outputs.should_build == 'true'
        id: sign_apk
        run: |
          APK_PATH=$(find build-dir/app/build/outputs/apk -name "*.apk" | grep -v "unaligned" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Error: No release APK found!"
            exit 1
          fi

          echo "Found APK: $APK_PATH"
          SIGNED_APK="build-dir/TrueBit-${{ steps.check_release.outputs.upstream_tag }}.apk"

          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          echo "Using Android Build Tools: $BUILD_TOOLS"

          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Using custom signing keystore from secrets..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > keystore.jks
            
            $BUILD_TOOLS/apksigner sign \
              --ks keystore.jks \
              --ks-key-alias "${{ secrets.KEY_ALIAS }}" \
              --ks-pass "pass:${{ secrets.KEYSTORE_PASSWORD }}" \
              --key-pass "pass:${{ secrets.KEY_PASSWORD }}" \
              --out "$SIGNED_APK" \
              "$APK_PATH"
          else
            echo "No custom keystore secret found. Generating consistent signing key for this build..."
            keytool -genkeypair -v -keystore auto.keystore -alias truebit -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "truebitpass" -keypass "truebitpass" -dname "CN=TrueBit, OU=Audio, O=TrueBit, L=HQ, S=Audio, C=US"
            
            BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
            $BUILD_TOOLS/apksigner sign \
              --ks auto.keystore \
              --ks-key-alias truebit \
              --ks-pass pass:truebitpass \
              --key-pass pass:truebitpass \
              --out "$SIGNED_APK" \
              "$APK_PATH"
          fi

          echo "Signed APK ready at $SIGNED_APK"
          echo "apk_path=$SIGNED_APK" >> $GITHUB_OUTPUT

      - name: Generate TrueBit Rebadged Release Notes
        if: steps.check_release.outputs.should_build == 'true'
        run: |
          python3 - << 'EOF'
          import urllib.request, json, re, os

          tag = "${{ steps.check_release.outputs.upstream_tag }}"
          my_repo = "${{ github.repository }}"
          url = f"https://api.github.com/repos/kushagrasinghx/BitChord/releases/tags/{tag}"
          
          upstream_body = ""
          try:
              req = urllib.request.Request(url, headers={'User-Agent': 'TrueBit-Automation'})
              with urllib.request.urlopen(req) as resp:
                  data = json.loads(resp.read().decode())
                  upstream_body = data.get('body', '')
          except Exception as e:
              print(f"Could not fetch upstream release body: {e}")

          # Remove existing banners
          body = re.sub(r'!\[.*?banner.*?\]\(.*?\)', '', upstream_body, flags=re.IGNORECASE)
          
          lines = body.splitlines()
          filtered_lines = []
          skip_desktop = False
          for line in lines:
              stripped = line.strip()
              # Skip Desktop install sections
              if stripped.startswith('**Windows') or stripped.startswith('**Linux') or stripped.startswith('**macOS'):
                  skip_desktop = True
                  continue
              if skip_desktop:
                  if stripped.startswith('**') or stripped.startswith('## '):
                      skip_desktop = False
                  else:
                      continue
              if 'DESKTOP.md' in line or 'desktopApp' in line:
                  continue
                  
              # Strip Discord and Telegram mentions and links
              if any(keyword in stripped.lower() for keyword in ['discord.gg', 'discord.com/invite', 't.me/', 'telegram.me']):
                  continue
              if any(phrase in stripped.lower() for phrase in ['support channel', 'telegram group', 'community channel', 'discord']):
                  continue
                  
              # Strip donation / sponsor lines if any
              if any(keyword in stripped.lower() for keyword in ['buymeacoffee', 'liberapay', 'ko-fi', 'patreon', 'upi_support']):
                  continue

              filtered_lines.append(line)
          
          clean_body = '
'.join(filtered_lines).strip()
          
          # Rebrand BitChord -> TrueBit
          clean_body = clean_body.replace('BitChord', 'TrueBit')
          clean_body = clean_body.replace('bitchord', 'truebit')
          clean_body = clean_body.replace('kushagrasinghx/TrueBit', my_repo)
          clean_body = clean_body.replace('kushagrasinghx/truebit', my_repo)
          clean_body = clean_body.replace('kushagrasinghx/BitChord', my_repo)

          header = f"""![TrueBit Banner](https://raw.githubusercontent.com/{my_repo}/main/Banner.png)

# TrueBit {tag}
> **High-Fidelity Bit-Perfect Android Audio Player**  
> Autonomous build from upstream [BitChord {tag}](https://github.com/kushagrasinghx/BitChord/releases/tag/{tag}).

### 💎 TrueBit Enhancements Included
- 🌉 **Built-in Lossless Bridge**: Pre-configured Fly.io FLAC master resolver (`https://lossless-bridge.fly.dev/sksalapur`) supporting up to 24-bit / 192 kHz.
- 🎯 **Lossless-First Audio Routing**: Instant FLAC playback from 0:00 without lossy start delays.
- ⏩ **Predictive Queue Lookahead**: Pre-resolves and buffers the next 4 tracks in queue (2s delay).
- 🎛️ **Native 24-Bit PCM Audio Output**: Bit-perfect output tailored for Type-C DSPs and external DACs (Moondrop Chu II DSP).
- 📊 **Accurate Bitrate Telemetry**: Live FLAC/PCM bitrate telemetry in Nerd Stats.
- 🎨 **TrueBit Custom Branding**: Bespoke high-res squircle audio emblem across all DPIs.
- 🚀 **Stripped Desktop Bloat**: Pure Android-focused architecture.

---
"""

          footer = f"""
---
### 📲 Install & Update
Download **`TrueBit-{tag}.apk`** attached below and install it directly on Android (8.0+ / API 26+).
"""
          final_notes = header + (clean_body if clean_body else "See upstream BitChord release for detailed changes.") + footer
          with open("release_notes.md", "w", encoding="utf-8") as f:
              f.write(final_notes)
          print("Generated release_notes.md successfully!")
          EOF

      - name: Publish GitHub Release
        if: steps.check_release.outputs.should_build == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.check_release.outputs.truebit_tag }}
          target_commitish: ${{ github.sha }}
          token: ${{ secrets.GITHUB_TOKEN }}
          name: "TrueBit ${{ steps.check_release.outputs.upstream_tag }} (BitChord Auto-Patched)"
          body_path: release_notes.md
          files: ${{ steps.sign_apk.outputs.apk_path }}
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
